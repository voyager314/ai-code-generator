# 线上配置文件
# @author yzy
spring:
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-server-ip:3306/your-db
    username: usr
    password: yourpassword
  # redis
  data:
    redis:
      host: your-server-ip
      port: 6379
      database: 0
      password: yourpassword
      ttl: 3600
      user: default
# AI
langchain4j:
  open-ai:
    streaming-chat-model:
      base-url:
      api-key:
      log-requests: true
      log-responses: true
      model-name:
      # 超时配置
      timeout: 1800s # 给足时长，否则可能因过早终止而导致无法获取模型完成响应
      max-tokens: 8192
      max-retries: 3
    chat-model:
      base-url:
      api-key:
      log-requests: true
      log-responses: true
      model-name:
      # 超时配置
      timeout: 1800s
      max-tokens: 8192
      max-retries: 3
# 阿里云 DashScope 配置
dashscope:
  api-key:
  abstract-model-url:
  abstract-model:
  image-model:
# aliyunOSS服务用户配置
alioss:
  client:
    endpoint:
    bucketName:
    objPath:
    region:
# Pexels 图片搜索配置
pexels:
  api-key: "your-api-key"
# 生产环境关闭日志
mybatis-flex:
  configuration:
    log-impl: ''
# 接口文档配置
knife4j:
  basic:
    enable: true
    username:
    password:
# Agent Reflection 配置
agent:
  reflection:
    enabled: true
    max-retries: 2
    max-snapshot-chars: 60000
# 部署路径
code:
  deploy-host: http://your-server-ip/dist

# 上下文压缩配置
context-compression:
  enabled: true
  protection-zone-tokens: 40000
  effective-budget: 131072
  tiers:
    snip-threshold: 0.6
    prune-threshold: 0.8
    summarize-threshold: 0.95
  models:
    deepseek-v4-flash:
      context-window: 1048576
  tool-budgets:
    executeCommand: 5000
    runScript: 5000
    readFile: 3000
    searchCode: 1500
    readDir: 1000
